name: Test & build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Debug-signed APK: installable on any phone with "install unknown apps".
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: pfl-lol-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
