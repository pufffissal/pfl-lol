name: Test & build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Release build (fast, what users would get). Until a real keystore is
      # configured it is signed with the debug key, so it installs on any
      # phone that allows "install unknown apps".
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pfl-lol-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Publish the APK under "Releases" so it can be downloaded and
      # installed directly from a phone (artifacts are zipped).
      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pfl-lol.apk
          gh release create "build-${{ github.run_number }}" pfl-lol.apk \
            --target "${{ github.sha }}" \
            --title "PFL LoL – build ${{ github.run_number }}" \
            --notes "Automatic build of \`${{ github.ref_name }}\` at ${{ github.sha }}. Download **pfl-lol.apk** to install." \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
